version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the oldest Node we support (engines: >=20), otherwise the
      # types describe APIs that are missing at runtime for part of our users.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
