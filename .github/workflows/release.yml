name: Release

# Push a tag like v0.2.0 (matching package.json) to publish npm, the .mcpb bundle and the registry entry.
#
# npm auth is Trusted Publishing (OIDC), like the other Encorp packages: no NPM_TOKEN is stored
# anywhere, and provenance is attached automatically. One-time setup: docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm Trusted Publishing and MCP Registry GitHub OIDC login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11.x; Trusted Publishing needs npm >= 11.5.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Check npm supports Trusted Publishing
        run: |
          npm --version
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              throw new Error(`Trusted Publishing needs npm >= 11.5.1, got ${v}`);
            }
          '

      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: GitHub's OIDC token is exchanged for a one-shot npm token and npm
      # attaches provenance by itself, so --provenance is not passed.
      - name: Publish to npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if npm view "nulabg-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "nulabg-mcp@${VERSION} is already on npm — skipping publish, releasing the rest."
          else
            npm publish --access public
          fi

      - name: Pack Claude Desktop bundle
        run: npm run pack:mcpb

      - name: Create GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "nulabg-mcp-${VERSION}.mcpb" --generate-notes

      - name: Update server.json (version, bundle URL and SHA-256)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(sha256sum "nulabg-mcp-${VERSION}.mcpb" | cut -d' ' -f1)
          node -e '
            const fs = require("fs");
            const [version, sha, repo] = process.argv.slice(1);
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = version;
            for (const p of s.packages) {
              p.version = version;
              if (p.registryType === "mcpb") {
                p.identifier = `https://github.com/${repo}/releases/download/v${version}/nulabg-mcp-${version}.mcpb`;
                p.fileSha256 = sha;
              }
            }
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          ' "$VERSION" "$SHA" "$GITHUB_REPOSITORY"

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
